[package]
name = "whizreveal"
version = "1.3.0"
description = "A focused native raffle controller and presentation display"
authors = ["JAYCEE 曾令强"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "whizreveal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.5"
tempfile = "3"
fs2 = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
